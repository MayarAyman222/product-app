<div class="container py-4">
    <h2 class="mb-3">Shop — All Products</h2>

    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-6">
            <div class="input-group">
              <input [(ngModel)]="searchText" (ngModelChange)="onSearchChange()"
                     class="form-control" placeholder="Search products (name or description)"/>
              <button class="btn btn-outline-secondary" (click)="clearSearch()">Clear</button>
            </div>
          </div>

          <div class="col-md-2">
            <select class="form-select" [(ngModel)]="selectedCategory" (change)="applyFilters()">
              <option *ngFor="let c of categories" [value]="c">{{ c | titlecase }}</option>
            </select>
          </div>

          <div class="col-md-2">
            <select class="form-select" [(ngModel)]="availabilityFilter" (change)="applyFilters()">
              <option value="all">All availability</option>
              <option value="in">In stock</option>
              <option value="out">Out of stock</option>
            </select>
          </div>

          <div class="col-md-2">
            <label class="form-label small mb-0">Min rating</label>
            <select class="form-select" [(ngModel)]="minRating" (change)="applyFilters()">
              <option [ngValue]="0">Any</option>
              <option [ngValue]="3">≥ 3</option>
              <option [ngValue]="4">≥ 4</option>
              <option [ngValue]="4.5">≥ 4.5</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border" role="status"></div>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

    <div *ngIf="filtered.length === 0 && !loading" class="text-center text-muted py-5">
      No products match your filters.
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
      <div class="col" *ngFor="let p of filtered">
        <div class="card h-100 shadow-sm product-card" (click)="openProduct(p)" style="cursor:pointer;">
          <img [src]="p.thumbnail || (p.images && p.images[0])" class="card-img-top object-fit-cover" alt="{{p.title}}" style="height:180px; object-fit:cover;">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title mb-1">{{ p.title }}</h5>
            <p class="card-text text-truncate mb-1" style="max-height:3.6em;">{{ p.description }}</p>

            <div class="mt-auto d-flex justify-content-between align-items-center">
              <div>
                <div class="fw-bold fs-5">${{ p.price }}</div>
                <small class="text-muted">Rating: {{ p.rating ?? '—' }}</small>
              </div>
              <div class="text-end">
                <span class="badge"
                      [ngClass]="{
                        'bg-success': (p.availabilityStatus ? !(p.availabilityStatus.toLowerCase().includes('out')) : (p.stock && p.stock>0)),
                        'bg-danger': (p.availabilityStatus ? p.availabilityStatus.toLowerCase().includes('out') : !(p.stock && p.stock>0))
                      }">
                  {{ p.availabilityStatus || (p.stock!>0 ? 'In stock' : 'Out of stock') }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
